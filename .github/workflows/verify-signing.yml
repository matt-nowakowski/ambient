name: Verify signing secrets

# Manual check that the release environment's Apple secrets work, without
# building anything: the certificate opens with its password and holds a
# Developer ID identity, and the App Store Connect key + issuer authenticate.
# Prints pass/fail only, never secret values.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository_owner == 'matt-nowakowski'
    runs-on: macos-latest
    timeout-minutes: 10
    environment: release
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Certificate opens with its password
        shell: bash
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" verify.keychain
          if ! security import "$cert" -k verify.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD does not open APPLE_CERTIFICATE"; exit 1
          fi
          rm -f "$cert"
          security find-identity -v -p codesigning verify.keychain | grep -q "Developer ID Application:.*($APPLE_TEAM_ID)" \
            || { echo "::error::No Developer ID Application identity for team APPLE_TEAM_ID"; exit 1; }
          echo "PASS: certificate, password and team ID"

      - name: App Store Connect key and issuer authenticate
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          ( umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$key" )
          if ! xcrun notarytool history --key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" > /dev/null 2>&1; then
            echo "::error::Notary service rejected APPLE_API_KEY / APPLE_API_KEY_P8 / APPLE_API_ISSUER"; exit 1
          fi
          echo "PASS: notarization key, key ID and issuer"

      - name: Clean up
        if: always()
        run: |
          security delete-keychain verify.keychain 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
