name: "code quality"
# Runs on pull requests and on demand only: work lands on main directly and
# these checks are run locally before each commit (no emails on every push).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/src/**"
      - "src-tauri/swift/**"
      - "src-tauri/vendor/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/deny.toml"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check network egress (only the allowlisted files reach the network)
        run: bun run check:egress

      - name: Check translation consistency
        run: bun run check:translations

      - name: Check model language coverage
        run: bun run check:model-languages

      - name: Check bundled model catalog matches packages/models
        run: bun run check:catalog

      - name: Test keyboard utilities
        run: bun run test:keyboard

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check

  licenses:
    # Every Rust dependency must be under a licence src-tauri/deny.toml allows
    # (permissive only; no GPL, LGPL or AGPL).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install cargo-deny
        run: cargo install cargo-deny@0.20.2 --locked

      - name: Check dependency licences
        working-directory: src-tauri
        run: cargo deny check licenses
