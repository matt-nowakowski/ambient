name: "code quality"
# Runs on pull requests and on demand only: work lands on main directly and
# these checks are run locally before each commit (no emails on every push).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/src/catalog/catalog.json"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      - name: Check model language coverage
        run: bun run check:model-languages

      - name: Check bundled model catalog matches packages/models
        run: bun run check:catalog

      - name: Test keyboard utilities
        run: bun run test:keyboard

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check
