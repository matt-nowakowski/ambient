name: "Release"

# Trigger: push a version tag that matches tauri.conf.json, from main.
#   git tag v0.1.1 && git push origin v0.1.1
# The tag must point at a commit on main and equal the app version, or the run
# stops before any secret is touched. Signing, notarization, updater and R2
# secrets are read only by jobs that declare `environment: release`, which
# accepts deployments from main and v* tags only.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time: two runs would race on R2 (upload, manifest, prune).
concurrency:
  group: ambient-r2-write
  cancel-in-progress: false

jobs:
  create-release:
    if: github.repository_owner == 'matt-nowakowski'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches app version and is on main
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $VERSION"; exit 1
          fi
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::src-tauri/Cargo.toml version $CARGO_VERSION != $VERSION"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"; exit 1
          fi
          echo "Releasing $VERSION from $GITHUB_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const tag = `v${{ steps.check.outputs.version }}`;
            const { owner, repo } = context.repo;
            // A re-run of the whole workflow starts from a clean draft.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            for (const r of releases) {
              if (r.tag_name !== tag) continue;
              if (!r.draft) core.setFailed(`${tag} is already published`);
              else await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
            }
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: tag, draft: true, prerelease: false,
              generate_release_notes: true,
            });
            return data.id

  # The draft GitHub release is only a staging area: tauri-action uploads each
  # platform's installers and merges the updater feed (latest.json) there.
  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # Apple silicon. macOS 26 for the Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # Intel, cross-compiled.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # .deb on 22.04 for an older glibc floor
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # AppImage and RPM
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm"
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest" # x64. Unsigned unless AZURE_* secrets exist.
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "ambient"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  # Installers and the updater feed are served from R2. Layout:
  # releases/<version>/<asset>, plus releases/latest.json (Tauri updater, URLs
  # rewritten to our domain) and releases/manifest.json (what the website's
  # /dl/<id> links resolve). Only the current version is kept (R2 free tier).
  publish-r2:
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.create-release.outputs.version }}
      RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
      R2: s3://${{ vars.R2_BUCKET }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # Public base for asset URLs; the website redirects /releases/* to R2.
      # Later, with a download domain (see DL_DOMAIN_RUNBOOK.md in the internal
      # docs), set the DOWNLOADS_BASE_URL repo variable to it; no code change.
      PUBLIC_BASE: ${{ vars.DOWNLOADS_BASE_URL || 'https://tryambient.ai' }}/releases
      # Ambient's share of the account's 10 GB free tier (other projects use the
      # rest). Same cap as mirror-models.yml; releases and models share the bucket.
      BUDGET_BYTES: "6000000000"
      GRACE_MINUTES: "15"
    steps:
      - name: Download release assets
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          gh api --paginate "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.id) \(.name)"' | while read -r id name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/${{ github.repository }}/releases/assets/$id" > "$name"
          done
          ls -la

      - name: Validate updater feed
        run: |
          set -euo pipefail
          jq -e --arg v "$VERSION" '.version == $v' dist/latest.json > /dev/null \
            || { echo "::error::latest.json missing or not version $VERSION"; exit 1; }
          echo "Updater platforms:"; jq -r '.platforms | keys[]' dist/latest.json
          for p in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].signature | length > 0' dist/latest.json > /dev/null \
              || { echo "::error::latest.json has no signed entry for $p"; exit 1; }
          done

      - name: List R2 releases before
        run: aws --endpoint-url "$R2_ENDPOINT" s3 ls "$R2/releases/" --recursive || true

      - name: Check R2 budget
        run: |
          set -euo pipefail
          aws() { command aws --endpoint-url "$R2_ENDPOINT" "$@"; }
          # The CI key is scoped to this bucket, so only its usage is visible.
          used=$(aws s3api list-objects-v2 --bucket "${R2#s3://}" --query 'sum(Contents[].Size)' --output text)
          [ "$used" = "None" ] && used=0
          used=${used%.*}
          new=$(du -cb dist/* | tail -1 | cut -f1)
          echo "R2 bucket usage: $used bytes; this release adds $new bytes"
          if [ $((used + new)) -gt "$BUDGET_BYTES" ]; then
            echo "::error::Release would push R2 over budget"; exit 1
          fi

      - name: Upload to R2
        run: |
          set -euo pipefail
          aws() { command aws --endpoint-url "$R2_ENDPOINT" "$@"; }
          aws s3 cp dist/ "$R2/releases/$VERSION/" --recursive --exclude latest.json \
            --cache-control "public, max-age=31536000, immutable"
          # Point the updater feed at our host instead of GitHub.
          sed -E "s#https://github.com/[^\"]+/releases/download/[^/\"]+/#$PUBLIC_BASE/$VERSION/#g" \
            dist/latest.json > latest.json
          grep -q "github.com" latest.json && { echo "::error::latest.json still points at GitHub"; exit 1; }
          jq -e . latest.json > /dev/null
          ls dist | grep -v '^latest.json$' \
            | jq -R . | jq -s --arg v "$VERSION" '{version: $v, files: .}' > manifest.json
          # The updater feed is cached briefly at the edge so repeat checks
          # land on Cloudflare instead of the bucket. Five minutes is well
          # inside GRACE_MINUTES (15), so a new release still reaches everyone
          # before the previous version's files are retired.
          aws s3 cp latest.json "$R2/releases/latest.json" --content-type application/json \
            --cache-control "public, max-age=300"
          # The manifest is what the website's /dl links resolve; always fresh.
          aws s3 cp manifest.json "$R2/releases/manifest.json" --content-type application/json \
            --cache-control "no-cache"
          cat manifest.json

      - name: Publish GitHub release
        run: gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=false --silent

      # The feed and manifest already point at the new version; the old files
      # stay up briefly so downloads and updates already in flight can finish.
      - name: Retire older versions
        run: |
          set -euo pipefail
          aws() { command aws --endpoint-url "$R2_ENDPOINT" "$@"; }
          echo "Keeping older versions for $GRACE_MINUTES minutes"
          sleep $((GRACE_MINUTES * 60))
          for p in $(aws s3 ls "$R2/releases/" | awk '/PRE/ {print $2}'); do
            [ "$p" = "$VERSION/" ] || aws s3 rm "$R2/releases/$p" --recursive
          done
          echo "R2 releases after:"
          aws s3 ls "$R2/releases/" --recursive
