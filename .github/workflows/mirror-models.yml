name: "Mirror models to R2"

# Copies speech models from Hugging Face into our R2 bucket so downloads keep
# working if the upstream repos go away. The app tries Hugging Face first and
# falls back to `{apiBaseUrl}/models/...`, which the website redirects here.
#
# R2's free tier (10 GB) is shared with other projects on the account, so the
# default set is the onboarding picks only and the run refuses to exceed
# `budget-gb` across every bucket.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Catalog ids to mirror (comma-separated)"
        default: "parakeet-unified-en-0.6b,nemotron-3.5-asr-streaming-0.6b,canary-180m-flash,whisper-medium,lang-id-voxlingua107-ecapa"
      budget-gb:
        description: "Max ambient-builds bucket usage after this run, in GB"
        default: "6"
      execute:
        description: "Write to R2 (otherwise dry run)"
        type: boolean
        default: false

permissions:
  contents: read

# Shares the release's lock: both write to the same R2 bucket.
concurrency:
  group: ambient-r2-write
  cancel-in-progress: false

jobs:
  mirror:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # R2 credentials live in the release environment (main and v* tags only).
    environment: release
    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Mirror
        env:
          IDS: ${{ inputs.ids }}
          BUDGET_GB: ${{ inputs.budget-gb }}
          EXECUTE: ${{ inputs.execute && '--execute' || '' }}
        run: |
          uv run scripts/mirror_models.py \
            --prefix models/ \
            --ids "$IDS" \
            --budget-gb "$BUDGET_GB" \
            --tmpdir "$RUNNER_TEMP" \
            $EXECUTE
