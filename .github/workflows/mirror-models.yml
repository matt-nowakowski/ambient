name: "Mirror models to R2"

# Copies speech models from Hugging Face into our R2 bucket so downloads keep
# working if the upstream repos go away. The app tries Hugging Face first and
# falls back to `{apiBaseUrl}/models/...`, which the website redirects here.
#
# R2's free tier (10 GB) is shared with other projects on the account, so the
# default set is the onboarding picks only and the run refuses to exceed
# `budget-gb` across every bucket.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Catalog ids to mirror (comma-separated)"
        default: "parakeet-unified-en-0.6b,nemotron-3.5-asr-streaming-0.6b,canary-180m-flash,whisper-medium,lang-id-voxlingua107-ecapa"
      budget-gb:
        description: "Max total R2 usage across the account after this run"
        default: "7"
      execute:
        description: "Write to R2 (otherwise dry run)"
        type: boolean
        default: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Mirror
        run: |
          uv run scripts/mirror_models.py \
            --prefix models/ \
            --ids "${{ inputs.ids }}" \
            --budget-gb "${{ inputs.budget-gb }}" \
            --tmpdir "$RUNNER_TEMP" \
            ${{ inputs.execute && '--execute' || '' }}
